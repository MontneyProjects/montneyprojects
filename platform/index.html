<!doctype html>
<html lang="en" data-theme="steelcap">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e10">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Steelcap Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash"><div class="mark"><img src="icon-192.png" alt="" style="width:96px;height:96px;border-radius:22px;margin:0 auto 18px"><div class="pro" id="splashName">STEELCAP PRO</div><div class="splashtag" id="splashTag">Built for the field</div><div class="bar"><i></i></div></div></div>

<!-- signed-out screens and the company setup wizard render here -->
<div id="gate" class="gate" hidden></div>

<!-- the app -->
<div id="app" hidden>
  <main id="main" class="view"></main>
  <nav class="tabs" id="tabs" aria-label="Main">
    <button type="button" data-go="home" data-tab="home" aria-selected="true"><span data-i="home"></span>Home</button>
    <button type="button" data-go="safety" data-tab="safety"><span data-i="shield"></span>Safety</button>
    <button type="button" data-go="tickets" data-tab="tickets"><span data-i="ticket"></span>Tickets</button>
    <button type="button" data-go="chat" data-tab="chat"><span data-i="chat"></span>Chat<span class="tbadge" id="chatBadge" hidden></span></button>
    <button type="button" data-go="more" data-tab="more"><span data-i="grid"></span>More</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
